server {
  listen 5000;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Service worker, its registration, the manifest and the entry page must never be cached, or clients keep an old app version.
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ /index.html; }
}
